# CI for payment-service (Milestone 6).
#
# Two jobs, and the split between them is the security boundary:
#
#   verify   runs on every pull request AND on every push to main. It holds
#            `contents: read` and nothing else, so it cannot even ask for an
#            OIDC token, let alone reach AWS.
#   publish  runs only on main, only after verify passed, and is the only job
#            in this repo that requests `id-token: write`.
#
# What actually stops a pull request from publishing is not the `if:` below -
# it is the trust policy on github-actions-sports-store-payment-service-ecr-push, whose sub
# condition is `repo:pyly-devops/sports-store-payment-service:ref:refs/heads/main`. A PR run's
# token carries `...:pull_request`, which never matches, so the AssumeRole call
# fails outright. The `if:` makes that visible in the file; it is not what
# makes it true.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a main run. A cancelled main run is a
# commit with no image in ECR, and because the next merge produces a different
# hash, nothing ever retroactively builds it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the Dockerfile's base image on purpose. Testing on a
      # different minor than the one that ships is how a green build fails in
      # a pod.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # requirements-dev.txt pulls in requirements.txt via -r, so this is one
      # install, not two.
      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Formatting
        run: ruff format --check .

      - name: Tests
        run: python -m pytest -q

      # No registry and no push - this job has no AWS identity by design.
      # --platform is a no-op on an x86_64 runner and is kept so this command
      # stays identical to the publish job's and to the workspace Makefile's.
      - name: Build the image
        run: docker build --platform linux/amd64 -t ci:${{ github.sha }} .

      # requirements.txt is the runtime set, requirements-dev.txt adds the test
      # tooling. That split is only safe if something proves the runtime set is
      # complete: move a genuinely-needed package into dev and the tests stay
      # green while the container breaks on first request. This is that proof,
      # and it needs no database - the module graph imports on its own.
      - name: The image can import its own application
        run: docker run --rm ci:${{ github.sha }} python -c "import main"

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Matches var.app_components in sports-store-infrastructure.
      ECR_REPOSITORY: sports-store/payment-service
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # No static AWS keys, ever (CLAUDE.md). vars.AWS_ACCOUNT_ID is a GitHub
      # Actions ORGANISATION variable, not a secret: an account id
      # authenticates as nothing and is already in git in the deployments
      # repo. It lives in one place so a new account is one edit rather than
      # seven PRs. The role name is written out because a reviewer should be
      # able to see what this file publishes as without opening settings.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-sports-store-payment-service-ecr-push
          aws-region: us-east-1 # matches envs/prod/variables.tf

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Compute the tag
        id: tag
        run: |
          set -euo pipefail
          version=$(tr -d ' \n' < VERSION)
          case "$version" in
            latest|"") echo "::error::VERSION must not be '$version'"; exit 1 ;;
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::VERSION is not semver: '$version'"; exit 1 ;;
          esac
          # git's own answer, not ${GITHUB_SHA:0:7}. The workspace Makefile
          # uses --short=7 too, so the two can never disagree about a commit
          # even on the day git needs eight characters to disambiguate.
          echo "tag=$version-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$ECR_REPOSITORY:$TAG"

          # Plain docker build + push, NOT docker/build-push-action: buildx
          # pushes an image index carrying provenance attestations, which show
          # up in the ECR console as a phantom unknown/unknown platform next to
          # every image. If this ever moves to buildx for its cache backends,
          # it needs `provenance: false`.
          docker build --platform linux/amd64 -t "$image" .

          # ECR repositories are IMMUTABLE (Milestone 4). Re-running this
          # workflow on the same commit would otherwise die on a tag that
          # already exists - the least useful red X there is. Same guard as the
          # workspace Makefile's push_if_new.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "already in ECR, tag not moved: $image"
          else
            docker push "$image"
          fi

          # bump-deployment (below) reads this job's `tag` output and opens the
          # PR that used to be a human's copy-paste into the deployments repo's
          # environments/production/images/payment-service.yaml. The run summary
          # line stays: it's still the fastest way to eyeball what shipped
          # without opening the bot's PR.
          echo "Pushed \`$TAG\` to \`$ECR_REPOSITORY\`" >> "$GITHUB_STEP_SUMMARY"

  # Separate job, not steps appended to publish: it puts the AWS identity and
  # the git-write identity on different runners. publish can push an image and
  # cannot touch git; this job can open a PR and cannot reach AWS.
  bump-deployment:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {} # GITHUB_TOKEN cannot write to another repo at ANY level, so granting it anything here is theatre.
    env:
      SERVICE: payment-service
      TAG: ${{ needs.publish.outputs.tag }}
    steps:
      # Mints a token scoped to exactly this App's installation on
      # sports-store-deployments — narrower than the App's own installation,
      # which is also installed on sports-store-gateway for the frontend-bump
      # flow this repo doesn't need.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.DEPLOY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPLOY_BOT_PRIVATE_KEY }}
          owner: pyly-devops
          repositories: sports-store-deployments

      # ref: deploy/payment-service is deliberately NOT passed here.
      # actions/checkout fails the whole step with "couldn't find remote
      # ref" if the ref doesn't exist yet — which it won't, on the very
      # first bump ever — so main is checked out unconditionally and the
      # deploy branch (if any) is created/moved onto below instead.
      - uses: actions/checkout@v4
        with:
          repository: pyly-devops/sports-store-deployments
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # Set BEFORE the merge below, not just before the commit further down.
      # A merge that isn't a fast-forward writes a merge commit, and git
      # refuses to write any commit without an identity. Configuring this
      # only in `Commit` made every bump fail with
      #
      #   fatal: empty ident name (for <runner@...>) not allowed
      #
      # whenever the previous bump was still an open PR — which is the normal
      # state of the stable-branch design below, not an edge case. Invisible
      # until then because a fast-forward writes no commit and needs no
      # identity. Broke all six publishing repos on 2026-08-07.
      - name: Configure the bot's git identity
        run: |
          set -euo pipefail
          git config user.name "cloudcart-deploy-argocd-bot[bot]"
          git config user.email "cloudcart-deploy-argocd-bot[bot]@users.noreply.github.com"

      # A stable branch name, no tag in it: deploy/payment-service means "the
      # pending bump for payment-service", of which there is exactly one. A
      # superseded bump replaces it rather than queuing behind an abandoned
      # PR. Never rebase, this repo never force-pushes — merge main into
      # whatever the branch already had, or start it fresh off main if this
      # is the first bump ever.
      - name: Move onto deploy/payment-service, merging main in
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin deploy/payment-service >/dev/null; then
            git checkout -B deploy/payment-service origin/deploy/payment-service
            # Only call it a conflict once there are actually unmerged paths.
            # This handler used to report EVERY merge failure as a conflict,
            # which is precisely what hid the missing-identity fatal above it
            # and sent a reader hunting for a content conflict that never
            # existed. git's own message stays in the log either way.
            if ! git merge --no-edit origin/main; then
              if [ -n "$(git ls-files --unmerged)" ]; then
                echo "::error::merge conflict against main on deploy/payment-service — needs a human" >&2
              else
                echo "::error::git merge failed for a non-conflict reason — see the git output above" >&2
              fi
              exit 1
            fi
          else
            git checkout -B deploy/payment-service
          fi

      # mikefarah/yq's own Action wraps yq as a single --cmd string, which
      # doesn't compose well with strenv's shell-quoting rules below; the
      # binary invoked directly is more legible and behaves identically to
      # the Tier 1 verification run against this exact command.
      - name: Install yq
        run: |
          curl -sSL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Bump the image tag
        run: |
          set -euo pipefail
          # strenv, not a shell-interpolated string: the map key contains a
          # hyphen (services.payment-service), and the tag is data, never a
          # literal spliced into the query — this is the brief's
          # "YAML-aware tool, never a text replace."
          yq -i '.services[strenv(SERVICE)].image.tag = strenv(TAG)' \
            helm/sports-store/environments/production/images/payment-service.yaml

      - name: Commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "no change — tag already at $TAG"
            exit 0
          fi
          # Identity is configured once, before the merge — see the step above.
          git add helm/sports-store/environments/production/images/payment-service.yaml
          git commit -m "Bump payment-service to ${TAG}"
          # A plain push, never --force: main was just merged in above, not
          # rebased, so this branch's history is always a strict superset of
          # what's on the remote. No force-push, ever (CLAUDE.md).
          git push origin HEAD:deploy/payment-service

      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # `gh pr view` finds a PR by head branch regardless of state — a
          # branch whose only-ever PR already merged still "exists" to a
          # bare existence check, so this used to edit the OLD merged PR's
          # body and leave the new commit on the branch with nothing open
          # to land it. Found live (M8 Tier 4 verification, 2026-08-07):
          # every service's SECOND deploy ever did this silently. Checking
          # state explicitly is the fix — anything but OPEN needs a new PR.
          STATE=$(gh pr view deploy/payment-service --repo pyly-devops/sports-store-deployments --json state --jq .state 2>/dev/null || echo NONE)
          if [ "$STATE" = "OPEN" ]; then
            gh pr edit deploy/payment-service --repo pyly-devops/sports-store-deployments \
              --body "Bumps \`payment-service\` to \`${TAG}\`. Merging this **is** the deploy — Argo CD picks it up automatically."
          else
            gh pr create --repo pyly-devops/sports-store-deployments \
              --head deploy/payment-service --base main \
              --title "Bump payment-service to ${TAG}" \
              --body "Bumps \`payment-service\` to \`${TAG}\`. Merging this **is** the deploy — Argo CD picks it up automatically."
          fi
